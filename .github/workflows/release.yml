name: release

# Every merge into main that carries a changeset is a release (docs/releasing.md).
#
# `prepare` holds no write access: it versions the pending changesets on the newest main,
# decides with scripts/release-plan.mjs what to commit, tag and publish, and checks exactly that
# state. `release` holds the write access and npm's trust and runs no code of this repository:
# it pushes the release commit and its tag in one atomic push, and only then publishes to npm
# and creates the GitHub release. If main moved on while `prepare` checked, the run stands down
# with a notice and the run of the newer push releases instead; if it moves in the seconds
# before the push, the atomic push fails and nothing is published.
#
# A version that is on main but not on npm (a run that stopped after its push) is published by
# the next run; start one by hand with "Run workflow".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      base: ${{ steps.base.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      dist-tag: ${{ steps.plan.outputs.dist-tag }}
      commit: ${{ steps.plan.outputs.commit }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The newest main, not the commit that triggered the run: a run that waited behind
          # another one must not release an older state.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: node scripts/release-plan.mjs
      - run: pnpm --filter gravity exec playwright install --with-deps chromium
        if: steps.plan.outputs.publish == 'true'
      # What is published is what was just checked, versions included.
      - run: pnpm check
        if: steps.plan.outputs.publish == 'true'
      # The check takes minutes; a merge in that time moves main on, and its own run releases
      # this change too. Standing down here keeps this run green instead of failing its push.
      - id: current
        if: steps.plan.outputs.commit == 'true' || steps.plan.outputs.publish == 'true'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: node scripts/release-plan.mjs --still-current "$BASE"
      - name: Hand over the release
        if: steps.plan.outputs.commit == 'true' || steps.plan.outputs.publish == 'true'
        run: |
          # release/ is ignored by .gitignore, so the patch carries the versioned files only.
          git add -A
          git diff --cached --binary > release/release.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.commit == 'true' || steps.plan.outputs.publish == 'true'
        with:
          name: release
          path: |
            release/
            packages/*/dist/
          if-no-files-found: error

  release:
    needs: prepare
    if: needs.prepare.outputs.current == 'true' && (needs.prepare.outputs.commit == 'true' || needs.prepare.outputs.publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write # the release commit, the tag and the GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIST_TAG: ${{ needs.prepare.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Push the release commit and its tag, atomically
        if: needs.prepare.outputs.commit == 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index release/release.patch
          if [ "$TAG" = "true" ]; then
            git commit -m "chore(release): v$VERSION"
            git tag "v$VERSION"
            git push --atomic origin HEAD:main "v$VERSION"
          else
            git commit -m "chore(release): consume changesets without a release"
            git push origin HEAD:main
          fi
      - name: Find the release commit
        if: needs.prepare.outputs.publish == 'true'
        id: target
        run: |
          # The commit that set this version, wherever main is by now; its tag if it has one.
          sha=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" || true)
          if [ -z "$sha" ]; then
            sha=$(git log --format=%H --grep="^chore(release): v$VERSION\$" -1)
            [ -n "$sha" ] || { echo "No release commit for v$VERSION on main."; exit 1; }
            git tag "v$VERSION" "$sha"
            git push origin "v$VERSION"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.prepare.outputs.publish == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.prepare.outputs.publish == 'true'
        with:
          node-version-file: .nvmrc
      # Only to resolve workspace:^ while packing; no install script runs here.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: needs.prepare.outputs.publish == 'true'
      - name: Publish to npm
        if: needs.prepare.outputs.publish == 'true'
        # No token: npm trusts this workflow in the environment npm (trusted publishing), and pnpm
        # exchanges the job's OIDC token for a short-lived one per package. Packages already on
        # npm in this version are skipped, so a rerun finishes a release. No lifecycle script
        # runs while publishing.
        run: pnpm -r --filter "./packages/*" publish --tag "$DIST_TAG" --access public --provenance --no-git-checks --ignore-scripts
      - name: GitHub release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "The GitHub release v$VERSION exists."
            exit 0
          fi
          prerelease=()
          [ "$DIST_TAG" != "latest" ] && prerelease=(--prerelease)
          gh release create "v$VERSION" --target "$TARGET" --title "v$VERSION" \
            --notes-file release/notes.md "${prerelease[@]}"
