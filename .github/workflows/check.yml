name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gravity exec playwright install --with-deps chromium
      - run: pnpm check
      # The artifacts are built from the same views the checks just exercised, and the command
      # fails when a document loses pages or a slide overflows its sheet.
      - run: pnpm --filter gravity artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gravity-print
          path: examples/gravity/dist/*.pdf
          if-no-files-found: error

  # A pull request that changes what a package ships needs a changeset, or it never reaches npm
  # (docs/releasing.md); an empty one says "nothing for users" on purpose.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/changeset-check.mjs "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

