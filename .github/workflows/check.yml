name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gravity exec playwright install --with-deps chromium
      - run: pnpm check
      # The artifacts are built from the same views the checks just exercised, and the command
      # fails when a document loses pages or a slide overflows its sheet.
      - run: pnpm --filter gravity artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: gravity-print
          path: examples/gravity/dist/*.pdf
          if-no-files-found: error
