name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gravity exec playwright install --with-deps chromium
      - run: pnpm check
      # The artifacts are built from the same views the checks just exercised, and the command
      # fails when a document loses pages or a slide overflows its sheet.
      - run: pnpm --filter gravity artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gravity-print
          path: examples/gravity/dist/*.pdf
          if-no-files-found: error

  # A pull request that changes what a package ships needs a changeset, or it never reaches npm
  # (docs/releasing.md); an empty one says "nothing for users" on purpose.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/changeset-check.mjs "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

