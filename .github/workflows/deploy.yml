name: deploy

# Generated by `slidesend workflow`. Checks the talk and deploys it to AWS.
#
# Credentials come from OIDC: the job assumes the deploy role that `slidesend bootstrap
# --deploy` created, whose trust policy admits only this repository in the environment
# "production". The environment admits only main. No access key exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: assume the deploy role

# One deploy at a time, and never cancel one halfway: a stack update interrupted by the next
# push leaves CloudFormation rolling back while the new run waits for it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: examples/gravity
      - run: pnpm check
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          # The role's maximum, beyond the job's timeout: a slow deploy hits the timeout
          # rather than credentials that expired halfway through a stack update.
          role-duration-seconds: 7200
      - run: pnpm exec slidesend deploy --region ${{ secrets.AWS_REGION }}
        working-directory: examples/gravity
